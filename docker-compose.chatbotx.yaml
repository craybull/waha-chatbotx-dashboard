# Docker Compose configuration for WAHA ChatbotX App (Standalone Fork)
version: '3.8'

services:
  waha-chatbotx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waha-chatbotx-dashboard
    restart: always
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - '3000:3000'
    environment:
      - WAHA_LOG_FORMAT=pretty
      - WAHA_LOG_LEVEL=debug
      - WAHA_ZIP_LOGS=false
      - WAHA_APPS_ENABLED=true
      - WAHA_APPS_ON=chatbotx
      - CHATBOTX_API_URL=https://app.chatbotx.io/api
      - CHATBOTX_API_TOKEN=${CHATBOTX_API_TOKEN:-}
      - CHATBOTX_MEDIA_BASE_URL=${CHATBOTX_MEDIA_BASE_URL:-}
    volumes:
      - ./sessions:/app/.sessions
      - ./media:/app/.media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '5'
